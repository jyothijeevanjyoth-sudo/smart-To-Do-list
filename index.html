<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart To-Do List</title>
</head>
<body>
<header>
<h1>Smart To-Do List</h1>
<p>Manage your tasks easily</p>
</header>
<main>
<section>
<h2>Add Task</h2>
<form id="todoForm">
<label for="todoInput">Task</label>
<input id="todoInput" type="text" placeholder="Enter a task">
<button type="submit">Add Task</button>
</form>
</section>
<section>
<h2>Task List</h2>
<ul id="taskList">
</ul>
</section>
<section>

<ul>
<li>
<span>Complete Python Assignment</span>
<button type="button">Complete</button>
<button type="button">Edit</button>
<button type="button">Delete</button>
</li>
</ul>
</section>
</main>
</body>
</html>
